syntax = "proto3";

package predisched;

import "task.proto";
import "common.proto";

option java_multiple_files = true;
option java_package = "com.predisched.proto";

message ExecuteRequest {
  TaskRequest task = 1;
  // <task_id>#<attempt>: names one attempt. A worker runs each dispatch id at most once; a
  // repeated ExecuteTask with the same id waits for, or returns, that run (prompt 10).
  string dispatch_id = 2;
}

message ExecuteResult {
  string task_id = 1;
  bool success = 2;
  string output = 3;
  int64 exec_time_ms = 4;
  int64 wait_time_ms = 5;
  int64 lamport_time = 6;
  // True when the worker's pool queue was full and nothing ran, so the
  // scheduler may place the task elsewhere instead of failing it.
  bool rejected = 7;
  // The executor is deterministic, so this output may be served from the result cache (F6).
  bool cacheable = 8;
  // The executor's ResourceProfile (CPU_BOUND, ...), for the execution history (prompt 11).
  string resource_profile = 9;
}

message RegisterRequest {
  string worker_id = 1;
  string host = 2;
  int32 port = 3;
  int32 cores = 4;
  int64 memory_mb = 5;
  int32 pool_size = 6;
  // Simulated slower hardware (prompt 15): executions take this many times as long. 0 means 1.
  // The predictive strategy passes it to the models, which were trained with it (prompt 18).
  double slowdown = 7;
}

message Heartbeat {
  string worker_id = 1;
  double cpu_pct = 2;
  double mem_pct = 3;
  int32 active_threads = 4;
  int32 queue_len = 5;
  int64 tasks_completed = 6;
  double avg_exec_ms = 7;
  int64 lamport_time = 8;
  // Draining (prompt 19): finishing current work, accepting nothing new. The scheduler stops
  // dispatching to it.
  bool draining = 9;
}

service WorkerService {
  rpc ExecuteTask (ExecuteRequest) returns (ExecuteResult);
  // Stops a running task: used for timeouts now (FR26) and for cancellation and
  // speculative execution later.
  rpc CancelExecution (CancelRequest) returns (Ack);
  // What this worker knows about one dispatch: how a promoted primary resolves a task the old
  // primary left RUNNING (prompt 10).
  rpc QueryExecution (QueryExecutionRequest) returns (ExecutionStatus);
}

message QueryExecutionRequest {
  string task_id = 1;
  string dispatch_id = 2;
}

enum ExecutionState {
  EXECUTION_UNKNOWN = 0;    // never received, or forgotten (the worker restarted)
  EXECUTION_RUNNING = 1;    // queued or running now
  EXECUTION_FINISHED = 2;   // done; result holds the outcome
}

message ExecutionStatus {
  ExecutionState state = 1;
  ExecuteResult result = 2;
}

message CancelRequest {
  string task_id = 1;
  string reason = 2;
}

// Served by the scheduler: workers announce themselves and report metrics.
service RegistryService {
  rpc Register      (RegisterRequest) returns (Ack);
  rpc SendHeartbeat (Heartbeat)       returns (Ack);
}
