syntax = "proto3";

package predisched;

import "common.proto";

option java_multiple_files = true;
option java_package = "com.predisched.proto";

// One change to a replicated task record (spec 10.5). payload is a TaskRecordProto.
// A replica keeps the copy with the higher lamport_time; equal times are broken by
// origin_node, so concurrent writes converge to the same value everywhere.
message ReplicateRequest {
  int64 seq_no = 1;         // position in the sender's replication log
  string op = 2;            // ENQUEUE, UPDATE_STATUS, CANCEL
  string task_id = 3;
  bytes payload = 4;
  int64 version = 5;        // per-task write count
  int64 lamport_time = 6;
  string origin_node = 7;   // node that made the write: last-writer-wins tie-break
}

// local_only: return this replica's own copy. Unset, the node answers with the read its
// consistency mode defines (a quorum read in strong mode), which is what clients use.
message ReadRequest {
  string task_id = 1;
  bool local_only = 2;
}

message ReadResponse {
  string task_id = 1;
  bytes payload = 2;
  int64 version = 3;
  int64 lamport_time = 4;
  string origin_node = 5;
  bool found = 6;
}

message SyncRequest {
  int64 from_seq = 1;
}

// Primary-backup (prompt 10): a backup that has caught up asks the primary to add it to the
// live set, the backups every write must reach before the client is acknowledged.
message JoinRequest {
  int32 node_id = 1;
  int64 last_seq = 2;       // the backup's last applied sequence number
  int64 last_lamport = 3;   // with last_origin, names the change at last_seq, so a log that
  string last_origin = 4;   // forked at the same length is not mistaken for one in step
}

message JoinResponse {
  bool joined = 1;          // true: in the live set now (or already)
  int64 primary_last_seq = 2;
  string message = 3;
  bool ready = 4;           // false: the node is not the primary (or not done promoting); try later
}

service ReplicationService {
  rpc Replicate (ReplicateRequest) returns (Ack);
  rpc Read      (ReadRequest)      returns (ReadResponse);
  rpc SyncFrom  (SyncRequest)      returns (stream ReplicateRequest);  // catch-up for new or recovered replicas
  rpc Join      (JoinRequest)      returns (JoinResponse);             // primary-backup: rejoin the live set
}
