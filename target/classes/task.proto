// ============================================================
// PrediSched — Distributed Task Scheduler
// Protocol Buffers Service Definition (Exp 1, 2, 3)
// ============================================================

syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.predisched.proto";
option java_outer_classname = "TaskProto";

package predisched;

// ──────────────────────────────────────────────
// RPC Service Definition
// ──────────────────────────────────────────────

service TaskService {
    // Submit a computational task to the server for processing
    rpc SubmitTask (TaskRequest) returns (TaskResponse);
}

// ──────────────────────────────────────────────
// Request Message
// ──────────────────────────────────────────────

message TaskRequest {
    string task_id           = 1;   // Unique identifier (e.g., T001)
    string task_type         = 2;   // CPU_TASK | MATRIX_TASK | SLEEP_TASK
    string input             = 3;   // Task-specific input value
    int32  priority          = 4;   // Task priority (1 = low, 10 = high)
    int64  logical_timestamp = 5;   // Lamport logical timestamp
}

// ──────────────────────────────────────────────
// Response Message
// ──────────────────────────────────────────────

message TaskResponse {
    string task_id           = 1;    // Echo of the submitted task ID
    string status            = 2;    // COMPLETED | FAILED
    string result            = 3;    // Computed result or error detail
    string message           = 4;    // Human-readable status message
    int64  logical_timestamp = 5;    // Lamport logical timestamp
}
