name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -q verify

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            spark/requirements.txt
            mpi/requirements.txt
            ml/requirements.txt
      - name: Install OpenMPI
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Install Python dependencies
        run: pip install -r spark/requirements.txt -r mpi/requirements.txt -r ml/requirements.txt
      - name: Spark job tests
        working-directory: spark
        run: python -m pytest -q
      - name: MPI tests
        working-directory: mpi
        env:
          OMPI_MCA_rmaps_base_oversubscribe: '1'
        run: python -m pytest -q
      - name: ML tests
        working-directory: ml
        run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Prompt 24: the whole stack in Docker, then the lab demo against it as a smoke test.
  compose:
    runs-on: ubuntu-latest
    needs: [build, dashboard]
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -f docker/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: $COMPOSE up --build -d --wait --wait-timeout 600
      - name: Services
        run: $COMPOSE ps
      - name: Lab demo
        run: scripts/demo.sh --no-pause --docker
      - name: One leader, three workers
        run: |
          curl -fsS localhost:8080/api/overview | grep -q '"activeWorkers":3'
          test "$(curl -fsS localhost:8080/api/cluster/leader | grep -o '"isLeader":true' | wc -l)" = 1
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Stop
        if: always()
        run: $COMPOSE down -v
