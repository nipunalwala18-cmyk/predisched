# Dataset campaign (prompt 15, spec 12.1 / 7.3 / 7.4): every profile x pattern x strategy is one
# run. The trace of a (profile, pattern) pair is generated once with a fixed seed and replayed under
# each strategy, so strategies see identical work. Run with:
#   python scripts/collect-dataset.py --config configs/campaign.yaml
campaign: "c15"                  # run ids are <campaign>-<profile>-<pattern>-<strategy>
nodeConfig: "configs/campaign-node.yaml"
profilesFile: "configs/workloads.yaml"
traceDir: "workloads/campaign"
seed: 1500                       # seed of pair i is seed + i (pairs in the order below)
tasksPerRun: 160                 # 72 runs x 160 = 11,520 executions (target >= 10,000)
# Base arrivals per second of a pair's trace: drawn per (profile, pattern) pair from this list with
# Random(seed + pair index), so load runs from idle to saturated across the dataset without being
# tied to a profile or pattern. Capacity is roughly 20-30 tasks/s for the mixed profile here.
rates: [6, 15, 30, 45]
speed: 1.0                       # replay speed factor
runTimeoutMs: 240000             # give up waiting for a run's tasks after this long

profiles: [cpu_heavy, io_heavy, mixed, bursty, long_tail, deadline]
patterns: [steady, bursty, periodic]
strategies: [round_robin, random, least_loaded, resource_aware]

scheduler: {port: 51051}
# Heterogeneous workers. Locally: pool size plus a simulated slowdown (the worker stretches every
# execution to slowdown x its real time). In Docker the same profiles also carry real CPU and
# memory limits (cpus / mem_limit, used by docker compose in prompt 24).
workers:
  - {id: worker-1, port: 51061, poolSize: 2, slowdown: 2.0, cpus: 1.0, mem_limit: 512m}
  - {id: worker-2, port: 51062, poolSize: 4, slowdown: 1.0, cpus: 2.0, mem_limit: 1g}
  - {id: worker-3, port: 51063, poolSize: 8, slowdown: 1.0, cpus: 4.0, mem_limit: 2g}

mockHttp: {port: 8100}           # HTTP_TASK target (scripts/mock-http.py)

# Labels (ml/build_dataset.py): looked up N seconds after each dispatch in worker_metrics.
labels:
  horizonSeconds: 5
  cpuThreshold: 85.0             # overloaded if CPU above this ...
  queueFactor: 1.0               # ... or worker queue >= queueFactor x its pool size
  sampleToleranceSeconds: 2.0    # a future sample must exist within this of t + N

# Held out for prompt 16's generalisation (pattern) and cold-start (task type) tests.
holdout:
  pattern: periodic
  taskType: GRAPH_TASK
