# Dashboard (docker/dashboard.Dockerfile): the React build, plus the dashboard API on the same
# origin so neither CORS nor a build-time API URL is needed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://dashboard-api:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location /ws/ {
        proxy_pass http://dashboard-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    location ~ ^/(swagger-ui|v3/api-docs|actuator) {
        proxy_pass http://dashboard-api:8080;
        proxy_set_header Host $host;
    }
    # Client-side routes (react-router) fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
